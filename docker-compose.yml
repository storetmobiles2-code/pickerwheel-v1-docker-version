# PickerWheel Docker Compose - PostgreSQL Version
# Real-time transaction management with ACID compliance

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pickerwheel-db
    environment:
      POSTGRES_DB: pickerwheel
      POSTGRES_USER: pickerwheel
      POSTGRES_PASSWORD: pickerwheel123
      TZ: Asia/Kolkata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickerwheel -d pickerwheel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PickerWheel Backend
  pickerwheel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pickerwheel-app
    ports:
      - "9080:9080"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./assets:/app/assets
      - ./itemlist_dates_v2.txt:/app/itemlist_dates_v2.txt:ro
    environment:
      # This is the local dev/docker-compose stack, not a real production
      # deployment (that's the `production` branch's Procfile + a hosting
      # platform's managed env vars instead). Mislabeling this as
      # `production` would trip the fail-fast secrets check in
      # backend/app/config.py's validate_production_config() the moment it
      # ships, since this stack intentionally keeps simple, shared local
      # dev credentials rather than rotated production secrets.
      - FLASK_ENV=development
      - PORT=9080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=pickerwheel
      - DB_USER=pickerwheel
      - DB_PASSWORD=pickerwheel123
      - ADMIN_PASSWORD=myTAdmin2025
      - TZ=Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
